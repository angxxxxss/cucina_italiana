<!doctype html>
<html lang="it">

  <title>Dettaglio Ricetta</title>

</head>
<body>
  <header class="site-header">

      <h1>La Cucina Italiana</h1>

  <main class="container">
    <a href="/">&larr; Torna alle ricette</a>
    <section id="recipe-detail" class="recipe-detail"></section>
  </main>

  <script src="/static/app.js"></script>

</html>
