<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>La Cucina Italiana - Ricette</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="site-header">
    <div>
      <h1>La Cucina Italiana</h1>
      <p>Scopri le ricette e crea il tuo carrello ingredienti.</p>
    </div>
    <div class="auth-box">
      <form id="login-form" class="login-form">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <div class="user-info" id="user-info">
        <span id="user-name"></span>
        <button id="logout-button">Logout</button>
      </div>
      <a class="cart-link" href="/cart.html">Carrello</a>
    </div>
  </header>

  <main class="container">
    <section class="filters">
      <label for="genre-filter">Filtra per genere</label>
      <select id="genre-filter">
        <option value="">Tutti</option>
      </select>
    </section>

    <section id="recipes" class="recipe-grid"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
